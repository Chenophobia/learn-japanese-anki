name: Dependabot auto-merge

# Enabling auto-merge is a one-shot action that sticks for the life of the
# PR, so there is nothing to redo when Dependabot force-pushes a rebase —
# without the type filter this re-ran on every `synchronize`.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only Dependabot's own PRs, and never on forks.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Chenophobia/learn-japanese-anki'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Enables GitHub's native auto-merge: the PR merges only once every
      # required check (the CI workflow) has passed, and simply stays open
      # for manual attention if CI fails. Major version bumps are left for
      # a human to review.
      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
