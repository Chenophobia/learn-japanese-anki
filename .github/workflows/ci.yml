name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly rebuild of main. Safety net for a GitHub Actions quirk: a PR
  # auto-merged by the GITHUB_TOKEN (see dependabot-auto-merge.yml) does not
  # fire this workflow's push trigger, so without this the deployed image
  # could silently stop tracking main.
  #
  # Tuesday, because the only merges that can go unnoticed are Dependabot's
  # and those all land Monday 06:00 UTC (see dependabot.yml) — a nightly run
  # would rebuild an unchanged main six times a week to cover a weekly event.
  # Worst case, an auto-merged dependency update reaches the image a day late.
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier + ESLint
        run: npm run lint
      - name: svelte-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Docker image
    needs: checks
    # arm64 runner (free for public repos): the deployment host is an Apple
    # Silicon Mac, so the image must be linux/arm64 — building it natively
    # avoids a painfully slow QEMU-emulated node-gyp compile of better-sqlite3.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # metadata-action also lowercases the repo name — GHCR requires
      # lowercase, but github.repository is "Chenophobia/…".
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
