version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    # One combined PR for routine minor/patch bumps keeps the Actions-minutes
    # cost of a weekly update cycle to a single CI run. Majors arrive as
    # individual PRs and are excluded from auto-merge.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'

  # Watches the base images in the Dockerfile (node:22-slim).
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
