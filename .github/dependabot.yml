version: 2
# Everything runs Monday 06:00 so a week's updates arrive together rather
# than trickling in. Each ecosystem can still only open its own PRs —
# Dependabot cannot group across ecosystems, and it cannot stack PRs (every
# branch is cut from, and targeted at, the default branch) — so the floor is
# one PR per ecosystem that has updates, and grouping is what keeps it there.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      # Routine bumps: one PR, auto-merged once CI passes.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Majors still need a human, but as a single PR instead of one per
      # package. fetch-metadata reports a group's highest semver change, so
      # this PR is never auto-merged.
      major:
        applies-to: version-updates
        update-types:
          - major
    # Security updates are deliberately left ungrouped: they are rare and
    # urgent, and one broken fix should not block the others in a shared PR.
    ignore:
      # @sveltejs/kit declares `peerOptional typescript "^5.3.3 || ^6.0.0"`,
      # so TypeScript 7 fails `npm ci` with ERESOLVE before the tests even
      # run. Drop this entry once Kit's peer range admits 7.
      - dependency-name: typescript
        update-types:
          - 'version-update:semver-major'
      # The next two are transitive-only, and no direct bump reaches them —
      # Dependabot re-attempts the security update on every run and fails,
      # which is where the recurring red "Dependabot Updates" runs came from.
      # Ignoring stops the retry; the alerts stay visible in the Security tab,
      # so this hides no risk. Revisit when the parent packages move.
      #
      # cookie@0.6.0 is pinned by @sveltejs/kit and does reach the built
      # server. The advisory needs untrusted input used as a cookie *name* or
      # attribute; Kit only ever passes literals there.
      - dependency-name: cookie
      # esbuild@0.18.20 comes via the abandoned @esbuild-kit/* packages under
      # drizzle-kit (a devDependency), so it never ships in the image — and
      # the advisory only concerns the dev server. drizzle-kit 0.31.10 is
      # already current; the fix has to come from upstream.
      - dependency-name: esbuild

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    groups:
      actions:
        patterns:
          - '*'

  # Watches the base images in the Dockerfile (node:22-slim).
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    groups:
      docker:
        patterns:
          - '*'
    ignore:
      # Dependabot offers the newest Node tag regardless of support status —
      # it proposed node:25, an odd-numbered line that never becomes LTS and
      # went end-of-life on 2026-03-31. Only even majors are worth taking, so
      # those jumps are made by hand.
      - dependency-name: node
        update-types:
          - 'version-update:semver-major'
